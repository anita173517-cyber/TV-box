name: Build UltraTV Pro APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Auto-Extract Uploaded ZIP
        run: |
          rm -rf ./src_extracted
          ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | sort | tail -n 1)
          if [ -n "$ZIP_FILE" ]; then
            echo "Extracting ZIP: $ZIP_FILE"
            unzip -o "$ZIP_FILE" -d ./src_extracted
          fi

      - name: Locate Project & Auto-Patch Lint Issues
        id: locate
        run: |
          SETTINGS_PATH=$(find . -name "settings.gradle.kts" | head -n 1)
          if [ -z "$SETTINGS_PATH" ]; then
            echo "ERROR: settings.gradle.kts not found!"
            exit 1
          fi
          PROJ_DIR=$(dirname "$SETTINGS_PATH")
          echo "project_dir=$PROJ_DIR" >> $GITHUB_OUTPUT
          echo "Project root: $PROJ_DIR"

          # Ensure proguard-rules.pro always exists
          if [ ! -f "$PROJ_DIR/app/proguard-rules.pro" ]; then
            cat << 'EOF' > "$PROJ_DIR/app/proguard-rules.pro"
          -keepattributes *Annotation*
          -keep class com.harindra.tvlauncher.** { *; }
          -dontwarn kotlin.**
          -dontwarn androidx.**
          EOF
          fi

          # Remove setHasFixedSize(true) to avoid RecyclerView lint error
          MAIN_KT="$PROJ_DIR/app/src/main/java/com/harindra/tvlauncher/MainActivity.kt"
          if [ -f "$MAIN_KT" ]; then
            sed -i '/setHasFixedSize(true)/d' "$MAIN_KT"
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Generate Release Keystore
        run: |
          keytool -genkeypair -v \
            -keystore ${{ github.workspace }}/ultratv-release.jks \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -alias ultratv \
            -storepass ultratv123 -keypass ultratv123 \
            -dname "CN=UltraTVPro, OU=TV, O=Harindra, L=Delhi, S=Delhi, C=IN"

      - name: Build Signed Release & Debug APKs
        working-directory: ${{ steps.locate.outputs.project_dir }}
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/ultratv-release.jks
          KEYSTORE_PASSWORD: ultratv123
          KEY_ALIAS: ultratv
          KEY_PASSWORD: ultratv123
        run: |
          gradle assembleRelease assembleDebug -x lintVitalRelease -x lint --no-daemon

      - name: Prepare Final APKs
        working-directory: ${{ steps.locate.outputs.project_dir }}
        run: |
          mkdir -p ${{ github.workspace }}/output_apks
          cp app/build/outputs/apk/release/app-release.apk ${{ github.workspace }}/output_apks/UltraTV-Pro-Release.apk
          cp app/build/outputs/apk/debug/app-debug.apk ${{ github.workspace }}/output_apks/UltraTV-Pro-Debug.apk
          ls -lh ${{ github.workspace }}/output_apks/

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: UltraTV-Pro-APKs
          path: output_apks/*.apk
          retention-days: 30
          
