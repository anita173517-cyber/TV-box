name: Build UltraTV Pro v2 APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Auto-Extract Uploaded ZIP
        run: |
          ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            echo "Found ZIP: $ZIP_FILE — extracting..."
            unzip -o "$ZIP_FILE" -d ./src_extracted
          fi

      - name: Locate Android Project Root
        id: locate
        run: |
          SETTINGS_PATH=$(find . -name "settings.gradle.kts" | head -n 1)
          if [ -z "$SETTINGS_PATH" ]; then
            echo "ERROR: settings.gradle.kts not found!"
            exit 1
          fi
          PROJ_DIR=$(dirname "$SETTINGS_PATH")
          echo "project_dir=$PROJ_DIR" >> $GITHUB_OUTPUT
          echo "Project root detected at: $PROJ_DIR"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Generate Release Keystore
        run: |
          keytool -genkeypair -v \
            -keystore ${{ github.workspace }}/ultratv-release.jks \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -alias ultratv \
            -storepass ultratv123 -keypass ultratv123 \
            -dname "CN=UltraTVPro, OU=TV, O=Harindra, L=Delhi, S=Delhi, C=IN"

      - name: Build Signed Release & Debug APKs
        working-directory: ${{ steps.locate.outputs.project_dir }}
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/ultratv-release.jks
          KEYSTORE_PASSWORD: ultratv123
          KEY_ALIAS: ultratv
          KEY_PASSWORD: ultratv123
        run: |
          gradle assembleRelease assembleDebug --no-daemon

      - name: Prepare Final APKs
        working-directory: ${{ steps.locate.outputs.project_dir }}
        run: |
          mkdir -p ${{ github.workspace }}/output_apks
          cp app/build/outputs/apk/release/app-release.apk ${{ github.workspace }}/output_apks/UltraTV-Pro-v2-Release.apk
          cp app/build/outputs/apk/debug/app-debug.apk ${{ github.workspace }}/output_apks/UltraTV-Pro-v2-Debug.apk

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: UltraTV-Pro-v2-APKs
          path: output_apks/*.apk
          retention-days: 30
